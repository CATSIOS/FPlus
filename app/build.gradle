plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.fplus'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.fplus"
        minSdk 29
        targetSdk 36
        versionCode 8
        versionName "1.4.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 只保留 arm64-v8a：现代手机几乎全是 64 位，砍掉 x86/x86_64/armeabi-v7a
        // 可将 TFLite native 库从 ~22MB 降到 ~5MB，APK 体积减半
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
            // 复用调试密钥签名，使 release 产物可直接安装（个人发布用）
            signingConfig signingConfigs.debug
        }
    }
    aaptOptions {
        // 禁止压缩 tflite 模型文件：避免加载时在内存解压，初始化更快、省额外内存拷贝
        noCompress "tflite"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    // 使用较新版本，已解决命名空间冲突
    implementation libs.tensorflow.lite.gpu.api
    implementation libs.tensorflow.lite
    implementation libs.tensorflow.lite.gpu
    //shizuku
    def shizuku_version = "13.1.5" // 建议使用最新版本
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version" // 添加此行以支持 Shizuku
}